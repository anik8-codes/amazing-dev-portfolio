name: infra

on:
  pull_request:
    paths: [infra/**]
  push:
    branches: [main]
    paths: [infra/**]

permissions:
  contents: read

concurrency:
  group: infra # never run two applies against the same state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}

defaults:
  run:
    working-directory: infra

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.13.9
      - run: tofu fmt -check -recursive
      - run: tofu init -input=false -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: tofu validate
      # Plan is printed to the log only; no plan file is written or uploaded.
      - if: github.event_name == 'pull_request'
        run: tofu plan -input=false -lock-timeout=5m
      - if: github.event_name == 'push'
        run: tofu apply -input=false -auto-approve -lock-timeout=5m
