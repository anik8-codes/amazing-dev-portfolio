name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same scopes as commitlint.config.mjs
          scopes: |
            hero
            modes
            scroll
            blog
            quests
            play
            audio
            api
            infra
            ci
            repo
            brand
            seo
          subjectPattern: ^[a-z].+$
          # release-please titles its own PRs `chore(main): release x.y.z`
          ignoreLabels: |
            autorelease: pending
